name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Verify tag matches Version.h
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $h = Get-Content CopyBasket/Version.h -Raw
          $maj = [regex]::Match($h, '#define\s+COPYBASKET_VERSION_MAJOR\s+(\d+)').Groups[1].Value
          $min = [regex]::Match($h, '#define\s+COPYBASKET_VERSION_MINOR\s+(\d+)').Groups[1].Value
          $pat = [regex]::Match($h, '#define\s+COPYBASKET_VERSION_PATCH\s+(\d+)').Groups[1].Value
          $expected = "v$maj.$min.$pat"
          Write-Host "Tag: $env:TAG   Version.h: $expected"
          if ($env:TAG -ne $expected) {
            throw "Tag $env:TAG does not match Version.h ($expected) - bump Version.h or retag."
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57  # v3

      - name: Build CopyBasket x64
        run: msbuild CopyBasket.sln /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

      - name: Build CopyBasket x86
        run: msbuild CopyBasket.sln /p:Configuration=Release /p:Platform=Win32 /verbosity:minimal

      - name: Build CB-CMT (regsvr Tool)
        run: msbuild "regsvr Tool\CopyBasketContextMenu.sln" /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

      - name: Install NSIS via scoop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Installing scoop..."
          Invoke-Expression "& { $(Invoke-RestMethod get.scoop.sh) } -RunAsAdmin"

          # Add scoop shims to PATH for this session
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"

          Write-Host "Adding extras bucket..."
          scoop bucket add extras

          Write-Host "Installing NSIS..."
          scoop install nsis

          $makensis = "$env:USERPROFILE\scoop\apps\nsis\current\makensis.exe"
          if (-not (Test-Path $makensis)) {
            throw "NSIS installation failed — $makensis not found"
          }
          Write-Host "NSIS ready at: $makensis"
          "NSIS_PATH=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build -Force | Out-Null
          Push-Location installer
          & "$env:NSIS_PATH" CopyBasket.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS build failed with exit code $LASTEXITCODE" }
          Pop-Location
          Get-ChildItem build\CopyBasket-*-setup.exe

      - name: Prepare release assets
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Path "_release" -Force
          Copy-Item "x64\Release\CopyBasket.dll" "_release\CopyBasket_x64.dll"
          Copy-Item "Release\CopyBasket.dll" "_release\CopyBasket_x86.dll"
          Copy-Item "regsvr Tool\bin\Release\CB-CMT.exe" "_release\CB-CMT.exe"
          Copy-Item "portable\README.txt" "_release\README.txt"
          Copy-Item "portable\Lies.mich.txt" "_release\Lies.mich.txt"
          Compress-Archive -Path "_release\*" -DestinationPath "CopyBasket_$env:TAG.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3
        with:
          # Release title shown as the page header, e.g. "CopyBasket v1.6.0".
          # Without this, softprops/action-gh-release uses the bare tag name
          # ("v1.6.0") — and the per-release .md no longer carries its own
          # "# CopyBasket vX.Y.Z" heading, so the header is the single title.
          name: CopyBasket ${{ github.ref_name }}
          # Per-release write-up lives in release-notes/v<X.Y.Z>.md and
          # MUST exist before pushing the tag — workflow fails otherwise.
          body_path: release-notes/${{ github.ref_name }}.md
          files: |
            CopyBasket_${{ github.ref_name }}.zip
            build/CopyBasket-*-setup.exe
